name: CRM Dashboard
slug: dashboard-crm
version: 1.0.0
description: Dashboard para gestión de relaciones con clientes
author: KardoCore Team
author_url: https://github.com/webcien/KardoTemplates
license: MIT
category: dashboard-themes
type: backend
tags:
- dashboard
- crm
- clientes
- gestión
- ventas
requirements:
  kardocore: '>=0.1.0'
  kardocss: '>=0.1.0'
  python: '>=3.11'
features:
- Diseño responsive para admin
- Sidebar colapsable
- Gráficos y estadísticas
- Tablas de datos avanzadas
- Compatible con KardoCSS
- Modo oscuro disponible
screenshots:
- screenshot-dashboard.png
- screenshot-tables.png
- screenshot-forms.png
colors:
  primary: '#0EA5E9'
  secondary: '#06B6D4'
  accent: '#10B981'
  background: '#F9FAFB'
  text: '#1F2937'
theme_config:
  layout: admin
  sidebar_style: fixed
  header_style: fixed
  sidebar_collapsed: false
  dark_mode: true
  kardocss_enabled: true
