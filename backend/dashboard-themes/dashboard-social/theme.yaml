name: Social Media Dashboard
slug: dashboard-social
version: 1.0.0
description: Dashboard para gestión de redes sociales y contenido
author: KardoCore Team
author_url: https://github.com/webcien/KardoTemplates
license: MIT
category: dashboard-themes
type: backend
tags:
- dashboard
- social media
- redes sociales
- contenido
- marketing
requirements:
  kardocore: '>=0.1.0'
  kardocss: '>=0.1.0'
  python: '>=3.11'
features:
- Diseño responsive para admin
- Sidebar colapsable
- Gráficos y estadísticas
- Tablas de datos avanzadas
- Compatible con KardoCSS
- Modo oscuro disponible
screenshots:
- screenshot-dashboard.png
- screenshot-tables.png
- screenshot-forms.png
colors:
  primary: '#EC4899'
  secondary: '#F472B6'
  accent: '#8B5CF6'
  background: '#F9FAFB'
  text: '#1F2937'
theme_config:
  layout: admin
  sidebar_style: fixed
  header_style: fixed
  sidebar_collapsed: false
  dark_mode: true
  kardocss_enabled: true
