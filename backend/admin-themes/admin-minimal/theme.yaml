name: Minimal Admin
slug: admin-minimal
version: 1.0.0
description: Panel de administración ultra minimalista enfocado en contenido
author: KardoCore Team
author_url: https://github.com/webcien/KardoTemplates
license: MIT
category: admin-themes
type: backend
tags:
- admin
- minimal
- simple
- panel
- backend
requirements:
  kardocore: '>=0.1.0'
  kardocss: '>=0.1.0'
  python: '>=3.11'
features:
- Diseño responsive para admin
- Sidebar colapsable
- Gráficos y estadísticas
- Tablas de datos avanzadas
- Compatible con KardoCSS
- Modo oscuro disponible
screenshots:
- screenshot-dashboard.png
- screenshot-tables.png
- screenshot-forms.png
colors:
  primary: '#0F172A'
  secondary: '#334155'
  accent: '#0EA5E9'
  background: '#F9FAFB'
  text: '#1F2937'
theme_config:
  layout: admin
  sidebar_style: fixed
  header_style: fixed
  sidebar_collapsed: false
  dark_mode: true
  kardocss_enabled: true
