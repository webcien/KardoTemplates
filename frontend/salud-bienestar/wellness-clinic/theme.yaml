name: "Wellness Clinic"
slug: "wellness-clinic"
version: "1.0.0"
description: "Plantilla moderna y profesional para clínicas de salud, centros de bienestar y consultorios médicos. Diseño limpio con enfoque en confianza y profesionalismo."
author: "KardoCore Team"
author_url: "https://github.com/webcien/KardoTemplates"
license: "MIT"
category: "salud-bienestar"
type: "frontend"
tags:
  - "salud"
  - "clinica"
  - "medico"
  - "bienestar"
  - "profesional"

requirements:
  kardocore: ">=0.1.0"
  kardocss: ">=0.1.0"
  python: ">=3.11"

features:
  - "Diseño responsive optimizado para móviles"
  - "Sistema de citas online integrable"
  - "Sección de servicios médicos"
  - "Perfiles de equipo médico"
  - "Blog de salud y consejos"
  - "SEO optimizado para búsquedas locales"
  - "Accesibilidad WCAG 2.1 AA"
  - "Formularios de contacto seguros"

screenshots:
  - "screenshot-home.png"
  - "screenshot-services.png"
  - "screenshot-team.png"

colors:
  primary: "#0EA5E9"
  secondary: "#06B6D4"
  accent: "#10B981"
  background: "#FFFFFF"
  text: "#1F2937"
  light: "#F0F9FF"

theme_config:
  layout: "default"
  header_style: "fixed"
  footer_style: "informative"
  sidebar: false
  dark_mode: false
  appointment_system: true

